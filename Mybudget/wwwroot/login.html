<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBudget — Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/login.css" rel="stylesheet" />
    <link href="/css/global.css" rel="stylesheet" />
</head>
<body>

    <div class="card">

        <div class="brand">
            <h1>MyBudget</h1>
            <p>Connectez-vous à votre espace</p>
        </div>

        <div id="alert-box" class="alert d-none"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Adresse e-mail</label>
                <input type="email" id="email" class="form-control" placeholder="vous@exemple.com" />
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" />
            </div>
            <button type="submit" class="btn btn-success" id="submit-btn">
                Se connecter
            </button>
        </form>

        <p class="text-center mt-3 text-muted" style="font-size:0.88rem">
            Pas encore de compte ? <a href="/register.html" class="text-success">S'inscrire</a>
        </p>

    </div>

    <script src="/js/login.js"></script>

</body>
</html>
