<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBudget — Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/global.css" rel="stylesheet" />
    <link href="/css/dashboard.css" rel="stylesheet" />
    <link href="/css/transactions.css" rel="stylesheet" />
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">MyBudget</div>
        <div class="navbar-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/transactions.html" class="active">Transactions</a>
            <a href="/categories.html">Catégories</a>
            <a href="/budgets.html">Budgets</a>
            <a href="/profil.html">Mon Profil</a>
        </div>
        <div class="navbar-user">
            <span id="user-email"></span>
            <button onclick="logout()" class="btn-logout">Déconnexion</button>
        </div>
    </nav>

    <!-- Contenu principal -->
    <main class="main-content">

        <div class="section-card">
            <div class="section-header">
                <h2>Mes transactions</h2>
                <button onclick="ouvrirModal()" class="btn-primary-custom" style="width:auto; padding: 0.5rem 1.2rem;">
                    + Ajouter
                </button>
            </div>

            <table class="table" id="transactions-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Catégorie</th>
                        <th>Montant</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="transactions-body">
                    <tr><td colspan="5" class="text-center">Chargement...</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <!-- Modal ajouter/modifier -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">

            <div class="modal-header">
                <h3 id="modal-title">Ajouter une transaction</h3>
                <button onclick="fermerModal()" class="modal-close">✕</button>
            </div>

            <form id="transaction-form">

                <!-- id caché — utilisé uniquement pour la modification -->
                <input type="hidden" id="transaction-id" />

                <div class="mb-3">
                    <label class="form-label">Montant (€)</label>
                    <input type="number" id="montant" class="form-control"
                           placeholder="ex: 50 pour entrée, -50 pour sortie" step="0.01" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <input type="text" id="description" class="form-control" placeholder="ex: Courses Carrefour" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" id="date-operation" class="form-control" />
                </div>

                <div class="mb-4">
                    <label class="form-label">Catégorie</label>
                    <select id="categorie-id" class="form-control">
                        <option value="">-- Choisir une catégorie --</option>
                    </select>
                </div>

                <div id="modal-alert" class="alert d-none"></div>

                <div class="modal-footer">
                    <button type="button" onclick="fermerModal()" class="btn-cancel">Annuler</button>
                    <button type="submit" class="btn-primary-custom" id="modal-submit-btn"
                            style="width:auto; padding:0.5rem 1.5rem;">
                        Enregistrer
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/transactions.js"></script>
</body>
</html>
