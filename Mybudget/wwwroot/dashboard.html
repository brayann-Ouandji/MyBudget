<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBudget — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/global.css" rel="stylesheet" />
    <link href="/css/dashboard.css" rel="stylesheet" />
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">MyBudget</div>
        <div class="navbar-links">
            <a href="/dashboard.html" class="active">Dashboard</a>
            <a href="/transactions.html">Transactions</a>
            <a href="/categories.html">Catégories</a>
            <a href="/budgets.html">Budgets</a>
        </div>
        <div class="navbar-user">
            <span id="user-email"></span>
            <button onclick="logout()" class="btn-logout">Déconnexion</button>
        </div>
    </nav>

    <!-- Contenu principal  -->
    <main class="main-content">

        <!-- Cartes de résumé -->
        <div class="summary-cards">

            <div class="summary-card green">
                <div class="summary-label">Total Entrées</div>
                <div class="summary-value" id="total-entrees">...</div>
            </div>

            <div class="summary-card red">
                <div class="summary-label">Total Sorties</div>
                <div class="summary-value" id="total-sorties">...</div>
            </div>

            <div class="summary-card blue">
                <div class="summary-label">Solde</div>
                <div class="summary-value" id="solde">...</div>
            </div>

        </div>

        <!-- Dernières transactions -->
        <div class="section-card">
            <div class="section-header">
                <h2>Dernières transactions</h2>
                <a href="/transactions.html" class="btn-link">Voir tout →</a>
            </div>
            <table class="table" id="transactions-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Catégorie</th>
                        <th>Montant</th>
                    </tr>
                </thead>
                <tbody id="transactions-body">
                    <tr><td colspan="4" class="text-center">Chargement...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Résumé budgets -->
        <div class="section-card">
            <div class="section-header">
                <h2>État des budgets</h2>
                <a href="/budgets.html" class="btn-link">Voir tout →</a>
            </div>
            <div id="budgets-list">
                <p class="text-muted text-center">Chargement...</p>
            </div>
        </div>

    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
