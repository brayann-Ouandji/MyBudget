<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBudget — Budgets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/global.css" rel="stylesheet" />
    <link href="/css/dashboard.css" rel="stylesheet" />
    <link href="/css/transactions.css" rel="stylesheet" />
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">💰 MyBudget</div>
        <div class="navbar-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/transactions.html">Transactions</a>
            <a href="/categories.html">Catégories</a>
            <a href="/budgets.html" class="active">Budgets</a>
        </div>
        <div class="navbar-user">
            <span id="user-email"></span>
            <button onclick="logout()" class="btn-logout">Déconnexion</button>
        </div>
    </nav>

    <!-- Contenu -->
    <main class="main-content">
        <div class="section-card">
            <div class="section-header">
                <h2>Mes budgets</h2>
                <button onclick="ouvrirModal()" class="btn-primary-custom"
                        style="width:auto; padding:0.5rem 1.2rem;">
                    + Ajouter
                </button>
            </div>

            <!-- Tableau des budgets -->
            <table class="table">
                <thead>
                    <tr>
                        <th>Catégorie</th>
                        <th>Mois / Année</th>
                        <th>Limite</th>
                        <th>Dépensé</th>
                        <th>Progression</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="budgets-body">
                    <tr><td colspan="6" class="text-center">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">

            <div class="modal-header">
                <h3 id="modal-title">Ajouter un budget</h3>
                <button onclick="fermerModal()" class="modal-close">✕</button>
            </div>

            <form id="budget-form">
                <input type="hidden" id="budget-id" />

                <div class="mb-3">
                    <label class="form-label">Catégorie</label>
                    <select id="category-id" class="form-control">
                        <option value="">-- Choisir une catégorie --</option>
                    </select>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Mois</label>
                        <select id="mois" class="form-control">
                            <option value="1">Janvier</option>
                            <option value="2">Février</option>
                            <option value="3">Mars</option>
                            <option value="4">Avril</option>
                            <option value="5">Mai</option>
                            <option value="6">Juin</option>
                            <option value="7">Juillet</option>
                            <option value="8">Août</option>
                            <option value="9">Septembre</option>
                            <option value="10">Octobre</option>
                            <option value="11">Novembre</option>
                            <option value="12">Décembre</option>
                        </select>
                    </div>
                    <div class="col">
                        <label class="form-label">Année</label>
                        <input type="number" id="annee" class="form-control"
                               placeholder="ex: 2026" min="2020" max="2100" />
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Montant limite (€)</label>
                    <input type="number" id="montant-limite" class="form-control"
                           placeholder="ex: 200" min="0" step="0.01" />
                </div>

                <div id="modal-alert" class="alert d-none"></div>

                <div class="modal-footer">
                    <button type="button" onclick="fermerModal()" class="btn-cancel">Annuler</button>
                    <button type="submit" class="btn-primary-custom"
                            style="width:auto; padding:0.5rem 1.5rem;">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/budgets.js"></script>
</body>
</html>
