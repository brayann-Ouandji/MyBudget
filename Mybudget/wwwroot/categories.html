<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBudget — Catégories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/global.css" rel="stylesheet" />
    <link href="/css/dashboard.css" rel="stylesheet" />
    <link href="/css/transactions.css" rel="stylesheet" />
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">💰 MyBudget</div>
        <div class="navbar-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/transactions.html">Transactions</a>
            <a href="/categories.html" class="active">Catégories</a>
            <a href="/budgets.html">Budgets</a>
        </div>
        <div class="navbar-user">
            <span id="user-email"></span>
            <button onclick="logout()" class="btn-logout">Déconnexion</button>
        </div>
    </nav>

    <!-- Contenu -->
    <main class="main-content">
        <div class="section-card">
            <div class="section-header">
                <h2>Mes catégories</h2>
                <button onclick="ouvrirModal()" class="btn-primary-custom"
                        style="width:auto; padding:0.5rem 1.2rem;">
                    + Ajouter
                </button>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Type</th>
                        <th>Couleur</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="categories-body">
                    <tr><td colspan="4" class="text-center">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">

            <div class="modal-header">
                <h3 id="modal-title">Ajouter une catégorie</h3>
                <button onclick="fermerModal()" class="modal-close">✕</button>
            </div>

            <form id="categorie-form">
                <input type="hidden" id="categorie-id" />

                <div class="mb-3">
                    <label class="form-label">Nom</label>
                    <input type="text" id="nom" class="form-control" placeholder="ex: Loisirs" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Type</label>
                    <select id="type-operation" class="form-control">
                        <!-- Les valeurs 0 et 1 correspondent à l'enum C# -->
                        <option value="0">Dépense</option>
                        <option value="1">Revenu</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Couleur</label>
                    <div class="couleur-options" id="couleur-options">
                        <span class="couleur-dot" data-couleur="rouge"
                              style="background:#dc3545" title="Rouge"></span>
                        <span class="couleur-dot" data-couleur="vert"
                              style="background:#198754" title="Vert"></span>
                        <span class="couleur-dot" data-couleur="bleu"
                              style="background:#0d6efd" title="Bleu"></span>
                        <span class="couleur-dot" data-couleur="orange"
                              style="background:#fd7e14" title="Orange"></span>
                        <span class="couleur-dot" data-couleur="jaune"
                              style="background:#ffc107" title="Jaune"></span>
                        <span class="couleur-dot" data-couleur="violet"
                              style="background:#6f42c1" title="Violet"></span>
                    </div>
                    <input type="hidden" id="couleur" value="rouge" />
                    <small class="text-muted">Couleur sélectionnée : <span id="couleur-label">Rouge</span></small>
                </div>

                <div id="modal-alert" class="alert d-none"></div>

                <div class="modal-footer">
                    <button type="button" onclick="fermerModal()" class="btn-cancel">Annuler</button>
                    <button type="submit" class="btn-primary-custom" id="modal-submit-btn"
                            style="width:auto; padding:0.5rem 1.5rem;">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/categories.js"></script>
</body>
</html>
