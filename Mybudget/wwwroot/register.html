<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBudget — Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/global.css" rel="stylesheet" />
    <link href="/css/register.css" rel="stylesheet" />
</head>
<body class="centered-page">

    <div class="card" style="width:100%; max-width:440px;">

        <div class="brand">
            <h1>MyBudget</h1>
            <p>Créez votre compte gratuitement</p>
        </div>

        <div id="alert-box" class="alert d-none"></div>

        <form id="register-form">

            <div class="row mb-3">
                <div class="col">
                    <label for="prenom" class="form-label">Prénom</label>
                    <input type="text" id="prenom" class="form-control" placeholder="Jean" />
                </div>
                <div class="col">
                    <label for="nom" class="form-label">Nom</label>
                    <input type="text" id="nom" class="form-control" placeholder="Dupont" />
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Adresse e-mail</label>
                <input type="email" id="email" class="form-control" placeholder="vous@exemple.com" />
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" />
            </div>

            <div class="mb-4">
                <label for="password-confirm" class="form-label">Confirmer le mot de passe</label>
                <input type="password" id="password-confirm" class="form-control" placeholder="••••••••" />
            </div>

            <button type="submit" class="btn-primary-custom" id="submit-btn">
                Créer mon compte
            </button>

        </form>

        <p class="footer-link mt-3">
            Déjà un compte ? <a href="/login.html">Se connecter</a>
        </p>

    </div>

    <script src="/js/register.js"></script>
</body>
</html>
