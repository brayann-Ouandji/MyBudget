<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBudget — Enregistrement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/register.css" rel="stylesheet" />
</head>
<body>

    <div class="card">

        <div class="brand">
            <h1>MyBudget</h1>
            <p>Créez un compte Mybudget</p>
        </div>

        <div id="alert-box" class="alert d-none"></div>

        <form id="register-form">
            <div class="mb-3">
                <label for="name" class="form-label">Nom(s)</label>
                <input type="text" id="name" class="form-control" placeholder="Dupont" />
            </div>
            <div class="mb-3">
                <label for="surname" class="form-label">Prénom(s)</label>
                <input type="text" id="surname" class="form-control" placeholder="Jean" />
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Adresse e-mail</label>
                <input type="email" id="email" class="form-control" placeholder="vous@exemple.com" />
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" />
            </div>
            <button type="submit" class="btn btn-success" id="submit-btn">
                S'inscrire
            </button>
        </form>


    </div>

    <script src="/js/register.js"></script>

</body>
</html>
